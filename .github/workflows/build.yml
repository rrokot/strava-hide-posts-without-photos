name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Check the userscript parses
        run: node --check strava-photo-filter-toggle.user.js

      # Mozilla's addons-linter, the same one AMO review runs: manifest schema, missing
      # icon files, remote code, deprecated APIs. Run via npx so the repository keeps no
      # Node dependencies. Warnings do not fail the build; errors do.
      - name: Lint the extension for the add-on stores
        run: npx --yes web-ext lint --source-dir=extension

      # Checks what the linter cannot know about: that the manifest, userscript header
      # and .meta.js stub agree on the version and that the content script keeps the
      # userscript's page context. Also regenerates extension/content.js.
      - name: Validate and package the extension
        run: python package-extension.py

      # content.js is generated from the userscript but committed, so it can go stale if
      # someone edits the userscript without repackaging.
      - name: Fail if extension/content.js is out of date
        run: git diff --exit-code extension/content.js

      - uses: actions/upload-artifact@v7
        with:
          name: extension-zip
          path: dist/*.zip
          if-no-files-found: error
